name: Temporary sequence activation standard

on:
  push:
    paths:
      - ".sequence-activation-trigger"

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardiser les spécifications d'exécution
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("UML_JeryMotro")
          msg_re = re.compile(r"^(\s*)([A-Za-z_][A-Za-z0-9_]*)\s+(-->+|->+)\s+([A-Za-z_][A-Za-z0-9_]*)\s*:")

          for path in sorted(root.glob("DS*.plantuml")):
              lines = path.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  stripped = line.strip()
                  if stripped == "autoactivate on":
                      continue
                  if stripped.startswith("activate ") or stripped.startswith("deactivate "):
                      continue

                  out.append(line)
                  m = msg_re.match(line)
                  if not m:
                      continue
                  indent, sender, arrow, receiver = m.groups()

                  if sender == receiver:
                      continue

                  if arrow.startswith("--"):
                      out.append(f"{indent}deactivate {sender}")
                  else:
                      out.append(f"{indent}activate {receiver}")

              path.write_text("\n".join(out) + "\n", encoding="utf-8")

      - name: Commit des DS
        shell: bash
        run: |
          rm -f .sequence-activation-trigger
          rm -f .github/workflows/tmp-sequence-activation-standard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UML_JeryMotro/DS*.plantuml
          git add -u .sequence-activation-trigger .github/workflows/tmp-sequence-activation-standard.yml || true
          git commit -m "style(DS): standardiser les activations UML" || exit 0
          git push
