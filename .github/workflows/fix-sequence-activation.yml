name: Fix sequence activations
on:
  push:
    paths: [".sequence-fix-trigger"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger les activations
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('UML_JeryMotro')
          human={'Visiteur','Utilisateur','Utilisateur Standard','Utilisateur Premium','Administrateur'}
          technical={'Planificateur (cron)','NASA FIRMS','n8n','JeryMotroNet','Vertex AI','Qdrant','WAHA','SMSGate','Service de notification','Services de notification'}
          for p in sorted(root.glob('DS*.plantuml')):
              lines=p.read_text(encoding='utf-8').splitlines()
              actors=[]
              for i,line in enumerate(lines):
                  m=re.match(r'^(\s*)actor\s+"([^"]+)"\s+as\s+(\w+)\s*$',line)
                  if m:
                      label,alias=m.group(2),m.group(3)
                      if label not in human or label in technical:
                          lines[i]=f'participant "{label}" as {alias}'
                      else:
                          actors.append(alias)
              # Locate first interaction.
              first=None; sender=None
              for i,line in enumerate(lines):
                  m=re.match(r'^\s*([A-Za-z_]\w*)\s+(?:->|-->)\s*([A-Za-z_]\w*)\s*:',line)
                  if m:
                      first=i; sender=m.group(1); break
              if first is None: continue
              # Activate every human actor before the first interaction.
              ins=[f'activate {a}' for a in actors if not any(x.strip()==f'activate {a}' for x in lines[:first])]
              if sender and sender not in actors and not any(x.strip()==f'activate {sender}' for x in lines[:first]):
                  ins.append(f'activate {sender}')
              if ins:
                  lines[first:first]=ins
              p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          rm -f .sequence-fix-trigger .github/workflows/fix-sequence-activation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A UML_JeryMotro/DS*.plantuml
          git commit -m 'fix(DS): corriger les activations et acteurs techniques' || exit 0
          git push
